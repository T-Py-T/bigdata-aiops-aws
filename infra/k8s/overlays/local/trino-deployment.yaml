# infra/k8s/overlays/local/trino-deployment.yaml
# Trino for federated SQL queries across multiple data sources

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-trino
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
      - name: trino
        image: trinodb/trino:429
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: trino-service
  namespace: analytics
spec:
  selector:
    app: trino
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

