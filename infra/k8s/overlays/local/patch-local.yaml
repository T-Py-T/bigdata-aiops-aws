---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ingest
  namespace: data-platform
spec:
  template:
    spec:
      containers:
      - name: kafka-ingest
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: KAFKA_BROKER
          value: "kafka-service.data-platform.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python_stream_processor
  namespace: data-platform
spec:
  template:
    spec:
      containers:
      - name: python_stream_processor
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        env:
        - name: KAFKA_BROKER
          value: "kafka-service.data-platform.svc.cluster.local:9092"
        - name: RAY_ADDRESS
          value: "ray://ray-head-service.data-platform.svc.cluster.local:10001"
