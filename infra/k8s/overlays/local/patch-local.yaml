# infra/k8s/overlays/local/patch-local.yaml
# Resource limits for local development - all services scaled down for laptop/small K8s
# Patches base deployments with development-friendly resource requests

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ingest
spec:
  template:
    spec:
      containers:
      - name: kafka-ingest
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
