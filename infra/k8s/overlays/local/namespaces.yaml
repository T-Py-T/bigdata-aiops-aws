# infra/k8s/overlays/local/namespaces.yaml
# Logical namespace grouping for MLOps platform services

---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    name: kafka
    environment: local
    tier: critical
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-processing
  labels:
    name: data-processing
    environment: local
    tier: processing
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    name: analytics
    environment: local
    tier: query
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestration
  labels:
    name: orchestration
    environment: local
    tier: control
---
apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
  labels:
    name: infrastructure
    environment: local
    tier: support
