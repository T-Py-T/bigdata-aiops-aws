apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-platform

resources:
  - namespace.yaml
  - kafka-local.yaml
  - storage.yaml
  - ../../base/python_stream_processor-deployment.yaml
  - ../../base/realtime_processor-deployment.yaml
  - ../../base/ksqdb_connector-deployment.yaml
  - ../../base/spark_batch_processor-deployment.yaml
  - ../../base/serving_trino-deployment.yaml
  - ../../base/visualization_superset-deployment.yaml
  - ../../base/visualization_metabase-deployment.yaml
  - ../../base/data_catalog-deployment.yaml
  - ../../base/airflow-deployment.yaml
  - ../../base/prometheus.yaml
  - ../../base/grafana.yaml

patchesStrategicMerge:
  - patch-local.yaml

configMapGenerator:
  - name: platform-config
    literals:
      - KAFKA_BROKER=kafka-service.data-platform.svc.cluster.local:9092
      - ENVIRONMENT=local
      - LOG_LEVEL=DEBUG

