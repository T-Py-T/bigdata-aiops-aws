apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-platform

resources:
  - namespace.yaml
  - kafka-local.yaml
  - storage.yaml

configMapGenerator:
  - name: platform-config
    literals:
      - KAFKA_BROKER=kafka-service.data-platform.svc.cluster.local:9092
      - ENVIRONMENT=local
      - LOG_LEVEL=DEBUG

