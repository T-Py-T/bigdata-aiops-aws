apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-platform

resources:
  - namespace.yaml
  - kafka-local.yaml
  - storage.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "alpine:latest"
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: platform-config
    literals:
      - KAFKA_BROKER=kafka-service.data-platform.svc.cluster.local:9092
      - ENVIRONMENT=local
      - LOG_LEVEL=DEBUG

