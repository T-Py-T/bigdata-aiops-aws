# infra/k8s/overlays/local/airflow-deployment.yaml
# Airflow for data pipeline orchestration

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
      - name: airflow
        image: apache/airflow:2.7.3-python3.11
        command: ["/bin/bash", "-c"]
        args:
          - |
            airflow db init || true
            airflow users create --role Admin --username admin --email admin@example.com --firstname admin --lastname admin --password admin || true
            airflow webserver
        ports:
        - containerPort: 8080
          name: webserver
        env:
        - name: AIRFLOW_HOME
          value: /home/airflow
        - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
          value: "sqlite:////home/airflow/airflow.db"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-service
  namespace: orchestration
spec:
  selector:
    app: airflow
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

