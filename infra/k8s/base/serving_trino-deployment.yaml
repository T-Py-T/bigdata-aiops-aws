apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-trino
  template:
    metadata:
      labels:
        app: serving-trino
    spec:
      containers:
      - name: serving-trino
        image: "{{ SERVING_TRINO_IMAGE }}"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: serving-trino
spec:
  selector:
    app: serving-trino
  ports:
  - port: 8080
    targetPort: 8080
