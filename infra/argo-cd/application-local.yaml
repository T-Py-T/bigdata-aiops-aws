apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-platform-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/T-Py-T/bigdata-aiops-aws
    targetRevision: infra
    path: infra/k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

