repos:
  - repo: local
    hooks:
      - id: scaffold-tests
        name: scaffold tests
        entry: python3 -m unittest discover -s tests -v
        language: system
        pass_filenames: false
      - id: shell-syntax
        name: shell syntax
        entry: bash -n create_project.sh infra/terraform/deploy.sh infra/terraform/destroy.sh
        language: system
        pass_filenames: false
      - id: terraform-format
        name: terraform format
        entry: terraform -chdir=infra/terraform fmt -check
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: ruff check services infra/airflow
        language: python
        additional_dependencies: [ruff==0.14.3]
        pass_filenames: false
