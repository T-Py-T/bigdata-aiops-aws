repos:
  - repo: local
    hooks:
      - id: scaffold-tests
        name: scaffold tests
        entry: bash -c 'python3 -m unittest discover -s tests -p test_scaffold.py -v; if [ -x .venv/bin/python ]; then .venv/bin/python -m unittest discover -s tests/unit -v; fi'
        language: system
        pass_filenames: false
      - id: shell-syntax
        name: shell syntax
        entry: bash -n create_project.sh infra/terraform/deploy.sh infra/terraform/destroy.sh
        language: system
        pass_filenames: false
      - id: terraform-format
        name: terraform format
        entry: terraform -chdir=infra/terraform fmt -check
        language: system
        pass_filenames: false
